[package]
name = "fishtongue"
version = "0.6.0-phase.6"
description = "A local-first conlang creation desktop application"
authors = ["FishTongue contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/whitefi2h/fishtongue-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fishtongue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
zeroize = "1"
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
